[package]
name = "cuisine"
version = "0.1.0"
edition = "2024"
default-run = "cuisine"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
tower-http = { version = "0.6.8", features = ["cors"] }
